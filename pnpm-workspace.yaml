packages:
  - apps/*
  - packages/*

# These exact NestJS releases were reviewed despite pnpm's release-age safeguard.
minimumReleaseAgeExclude:
  - "@nestjs/common@12.3.2"
  - "@nestjs/core@12.3.2"
  - "@nestjs/platform-fastify@12.3.2"
  - "@nestjs/testing@12.3.2"

# Prisma's pinned CLI and engine packages require install scripts for generated artifacts.
allowBuilds:
  "@prisma/engines": true
  prisma: true

strictPeerDependencies: true
