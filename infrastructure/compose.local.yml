services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: orbit
      POSTGRES_PASSWORD: root
      POSTGRES_USER: orbit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - orbit_postgres_data:/var/lib/postgresql

volumes:
  orbit_postgres_data:
